<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A great white pelican rides a teal city bicycle along a seaside road, facing right. Its webbed feet are on the pedals, one wing rests on the swept-back handlebar, and the tail of a small fish pokes out of the tip of its long bill. Flat vector illustration with a sea horizon, a low sun and a dashed road line.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cbbea"/>
      <stop offset="1" stop-color="#e4f2fb"/>
    </linearGradient>
    <radialGradient id="sunglow">
      <stop offset="0.45" stop-color="#ffe58a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe58a" stop-opacity="0"/>
    </radialGradient>
    <!-- one wheel, drawn at the origin and placed twice with <use> -->
    <g id="wheel">
      <circle r="101" fill="none" stroke="#2c2f38" stroke-width="14"/>
      <circle r="91" fill="none" stroke="#d3d7dc" stroke-width="7"/>
      <circle r="86.5" fill="none" stroke="#8f949c" stroke-width="1.5"/>
      <g stroke="#b9bec6" stroke-width="1.8" stroke-linecap="round">
        <line x1="11" y1="0" x2="86" y2="0"/>
        <line x1="10.3" y1="-3.8" x2="80.8" y2="-29.4"/>
        <line x1="8.4" y1="-7.1" x2="65.9" y2="-55.3"/>
        <line x1="5.5" y1="-9.5" x2="43" y2="-74.5"/>
        <line x1="1.9" y1="-10.8" x2="14.9" y2="-84.7"/>
        <line x1="-1.9" y1="-10.8" x2="-14.9" y2="-84.7"/>
        <line x1="-5.5" y1="-9.5" x2="-43" y2="-74.5"/>
        <line x1="-8.4" y1="-7.1" x2="-65.9" y2="-55.3"/>
        <line x1="-10.3" y1="-3.8" x2="-80.8" y2="-29.4"/>
        <line x1="-11" y1="-0" x2="-86" y2="-0"/>
        <line x1="-10.3" y1="3.8" x2="-80.8" y2="29.4"/>
        <line x1="-8.4" y1="7.1" x2="-65.9" y2="55.3"/>
        <line x1="-5.5" y1="9.5" x2="-43" y2="74.5"/>
        <line x1="-1.9" y1="10.8" x2="-14.9" y2="84.7"/>
        <line x1="1.9" y1="10.8" x2="14.9" y2="84.7"/>
        <line x1="5.5" y1="9.5" x2="43" y2="74.5"/>
        <line x1="8.4" y1="7.1" x2="65.9" y2="55.3"/>
        <line x1="10.3" y1="3.8" x2="80.8" y2="29.4"/>
      </g>
      <circle r="11" fill="#a9afb7" stroke="#2b3a55" stroke-width="2.5"/>
      <circle r="3.5" fill="#2b3a55"/>
    </g>
  </defs>

  <!-- ===== background: sky, sun, clouds, sea, sand, road ===== -->
  <g id="background">
    <rect width="1200" height="800" fill="url(#sky)"/>
    <circle cx="178" cy="162" r="96" fill="url(#sunglow)"/>
    <circle cx="178" cy="162" r="46" fill="#ffd45f"/>
    <g id="clouds" fill="#ffffff" opacity="0.92">
      <path d="M 300 120 a 26 26 0 0 1 48 -14 a 30 30 0 0 1 56 10 a 20 20 0 0 1 10 38 H 296 a 18 18 0 0 1 4 -34 Z"/>
      <path d="M 1010 150 a 22 22 0 0 1 40 -12 a 26 26 0 0 1 48 8 a 17 17 0 0 1 8 32 H 1006 a 15 15 0 0 1 4 -28 Z"/>
    </g>
    <rect y="560" width="1200" height="72" fill="#58a8d6"/>
    <rect y="560" width="1200" height="3" fill="#a9d7f0"/>
    <g stroke="#9fd2ee" stroke-width="3" stroke-linecap="round">
      <line x1="60" y1="588" x2="140" y2="588"/><line x1="200" y1="604" x2="250" y2="604"/>
      <line x1="880" y1="596" x2="960" y2="596"/><line x1="1040" y1="612" x2="1120" y2="612"/><line x1="770" y1="616" x2="820" y2="616"/>
    </g>
    <rect y="632" width="1200" height="20" fill="#ebd9b2"/>
    <rect y="652" width="1200" height="148" fill="#878e99"/>
    <rect y="652" width="1200" height="4" fill="#6f7681"/>
    <line x1="0" y1="740" x2="1200" y2="740" stroke="#eef1f4" stroke-width="6" stroke-dasharray="64 44" opacity="0.9"/>
    <!-- contact shadows under the tyres -->
    <ellipse cx="336" cy="694" rx="86" ry="9" fill="#3c4350" opacity="0.28"/>
    <ellipse cx="681.6" cy="694" rx="86" ry="9" fill="#3c4350" opacity="0.28"/>
    <!-- a single drifting feather behind the rider -->
    <g transform="rotate(-18 236 326)" opacity="0.9">
      <path d="M 214 330 c 10 -14 26 -20 44 -16 c -8 12 -26 20 -44 16 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="2" stroke-linejoin="round"/>
      <line x1="214" y1="330" x2="258" y2="314" stroke="#2b3a55" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ===== bicycle ===== -->
  <g id="bicycle" stroke-linecap="round" stroke-linejoin="round">
    <g id="wheels">
      <use href="#wheel" xlink:href="#wheel" x="330" y="582"/>
      <use href="#wheel" xlink:href="#wheel" x="675.6" y="582" transform="rotate(7 675.6 582)"/>
    </g>
    <!-- far crank arm and pedal (behind the frame) -->
    <g id="crank-far">
      <line x1="470.4" y1="592" x2="416.4" y2="592" stroke="#4a4f5a" stroke-width="7"/>
      <rect x="401.4" y="588" width="30" height="8" rx="2" fill="#2c2f38"/>
    </g>
    <!-- far leg (behind the frame) -->
    <g id="leg-far" fill="none" stroke="#d8784a" stroke-width="12">
      <path d="M 447 438 L 433 498 L 406.4 582"/>
      <path d="M 392.4 586 L 396.4 577 L 420.4 573 L 446.4 577 L 450.4 584 L 446.4 591 L 392.4 591 Z" fill="#d8784a" stroke="#2b3a55" stroke-width="3"/>
    </g>
    <g id="frame" fill="none" stroke="#2e8d8b" stroke-width="11">
      <line x1="330" y1="582" x2="470.4" y2="592"/>            <!-- chain stay -->
      <line x1="330" y1="582" x2="429.5" y2="458.1"/>  <!-- seat stay -->
      <line x1="470.4" y1="592" x2="429.5" y2="458.1"/>      <!-- seat tube -->
      <line x1="429.5" y1="458.1" x2="620" y2="460"/> <!-- top tube -->
      <line x1="470.4" y1="592" x2="632" y2="496"/>    <!-- down tube -->
      <line x1="620" y1="460" x2="632" y2="496" stroke-width="14"/> <!-- head tube -->
      <line x1="632" y1="496" x2="675.6" y2="582" stroke-width="9"/> <!-- fork -->
      <line x1="429.5" y1="458.1" x2="417.8" y2="419.9" stroke="#4a4f5a" stroke-width="7"/> <!-- seat post -->
      <line x1="620" y1="460" x2="609.4" y2="428" stroke="#4a4f5a" stroke-width="8"/>  <!-- steerer / quill -->
      <line x1="609.4" y1="428" x2="623.4" y2="424" stroke="#4a4f5a" stroke-width="8"/>  <!-- stem -->
      <!-- swept-back handlebar -->
      <path d="M 623.4 424 C 631.4 410 619.4 400 603.4 408" stroke="#4a4f5a" stroke-width="8"/>
      <!-- bottom bracket shell and head-tube lugs -->
      <circle cx="470.4" cy="592" r="9" fill="#206d6b" stroke="none"/>
    </g>
    <g id="drivetrain">
      <circle cx="330" cy="582" r="13" fill="none" stroke="#4a4f5a" stroke-width="5"/>
      <circle cx="470.4" cy="592" r="34" fill="none" stroke="#4a4f5a" stroke-width="6"/>
      <circle cx="470.4" cy="592" r="23" fill="none" stroke="#4a4f5a" stroke-width="3" stroke-dasharray="6 7"/>
      <!-- chain: top and bottom runs, tangent to ring and cog -->
      <g stroke="#3d414b" stroke-width="4.5" fill="none">
        <line x1="470.4" y1="558" x2="330" y2="569"/>
        <line x1="470.4" y1="626" x2="330" y2="595"/>
      </g>
      <g stroke="#8d929c" stroke-width="1.5" fill="none" stroke-dasharray="3 4">
        <line x1="470.4" y1="558" x2="330" y2="569"/>
        <line x1="470.4" y1="626" x2="330" y2="595"/>
      </g>
      <!-- near crank arm and pedal -->
      <line x1="470.4" y1="592" x2="524.4" y2="592" stroke="#4a4f5a" stroke-width="8"/>
      <circle cx="470.4" cy="592" r="6" fill="#4a4f5a"/>
      <rect x="508.4" y="587.5" width="32" height="9" rx="2" fill="#2c2f38"/>
    </g>
    <!-- saddle (the rump covers its middle) -->
    <path id="saddle" d="M 377.8 415.9 c 4 -12 30 -14 48 -10 c 12 2 26 4 34 8 c -6 8 -22 10 -40 9 c -18 0 -36 2 -42 -7 Z" fill="#5d3a2a" stroke="#2b3a55" stroke-width="3"/>
  </g>

  <!-- ===== pelican ===== -->
  <g id="pelican" stroke="#2b3a55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- far wing: black primary tips projecting past the rump, and the short tail -->
    <path id="primaries-far" d="M 448 338 C 404 342 362 348 322 352 L 330 358 L 318 365 L 424 376 C 434 366 442 352 448 338 Z" fill="#2a2d36"/>
    <path id="tail" d="M 362 372 C 340 374 318 380 304 388 L 322 396 L 298 402 L 322 408 L 308 416 C 330 416 350 412 368 406 Z" fill="#fbf7ee"/>
    <!-- body -->
    <path id="body" d="M 362 372
      C 400 330 450 300 500 294
      C 525 290 548 292 556 300
      C 566 262 606 208 706 178
      C 704 150 746 142 760 168
      L 754 195 L 744 207
      C 650 236 632 300 598 334
      C 610 345 614 360 612 372
      C 612 400 600 418 585 420
      C 560 438 530 444 505 442
      C 480 440 455 436 436 426
      C 400 420 380 416 368 406 Z" fill="#fbf7ee"/>
    <!-- belly shade (one tone) -->
    <path d="M 446 420 C 470 436 520 440 575 420 C 545 428 490 428 446 420 Z" fill="#e6ddcc" stroke="none"/>
    <!-- scapular / folded-wing plate hint on the flank -->
    <path d="M 392 356 C 440 338 500 332 548 352" fill="none" stroke-width="2.5" opacity="0.55"/>
    <!-- near leg: feathered thigh, shank with backward ankle, webbed foot on the pedal -->
    <g id="leg-near">
      <path d="M 450 428 C 458 440 482 444 496 430" fill="none" stroke-width="2.5" opacity="0.5"/>
      <path d="M 472 450 L 463 502 L 510.4 582" fill="none" stroke="#2b3a55" stroke-width="20"/>
      <path d="M 472 450 L 463 502 L 510.4 582" fill="none" stroke="#f08a57" stroke-width="13"/>
      <path id="foot-near" d="M 498.4 586 L 502.4 576 L 528.4 572 L 556.4 576 L 548.4 580 L 560.4 584 L 548.4 587 L 556.4 592 L 498.4 591 Z" fill="#f08a57" stroke-width="3"/>
      <path d="M 508.4 584 L 546.4 578 M 510.4 588 L 546.4 586" fill="none" stroke="#d3683c" stroke-width="1.8"/>
    </g>
    <!-- near wing: coverts white, secondaries dark along the trailing edge, primaries draped over the grip -->
    <g id="wing-near">
      <path d="M 536 297 C 576 316 592 362 595.4 399 C 576 414 552 428 520 420 C 498 412 484 394 488 368 C 494 340 512 314 536 297 Z" fill="#fbf7ee" stroke="none"/>
      <path d="M 536 297 C 576 316 592 362 595.4 399 C 576 414 552 428 520 420 C 498 412 484 394 488 368" fill="none"/>
      <path d="M 488 368 C 494 340 512 314 536 297" fill="none" stroke-width="2.5" opacity="0.35"/>
      <path d="M 502 342 C 534 350 560 372 574 398 M 494 370 C 520 380 544 398 556 414" fill="none" stroke-width="2.5" opacity="0.5"/>
      <path d="M 593.4 405 Q 560 430 546 426 Q 532 432 520 422 Q 506 424 498 410 Q 490 406 490 390 C 506 406 540 412 593.4 405 Z" fill="#2a2d36" stroke="none"/>
      <!-- the grip sits under the wrist; the primaries hang in front of it, so it is drawn here -->
      <line x1="603.4" y1="408" x2="565.4" y2="414" stroke="#2b3a55" stroke-width="15"/>
      <line x1="603.4" y1="408" x2="565.4" y2="414" stroke="#7a4a30" stroke-width="10"/>
      <!-- primaries: four feather tips hanging in front of the grip -->
      <path d="M 595.4 399 C 611.4 407 619.4 431 615.4 453 C 607.4 439 601.4 419 595.4 399 Z" fill="#2a2d36"/>
      <path d="M 591.4 403 C 603.4 413 607.4 437 601.4 457 C 595.4 441 589.4 421 591.4 403 Z" fill="#2a2d36"/>
      <path d="M 585.4 407 C 593.4 419 593.4 441 585.4 455 C 581.4 439 577.4 423 585.4 407 Z" fill="#2a2d36"/>
      <path d="M 579.4 411 C 583.4 423 579.4 439 571.4 447 C 569.4 433 569.4 419 579.4 411 Z" fill="#2a2d36"/>
    </g>
    <!-- head -->
    <g id="head">
      <!-- nape tuft -->
      <path d="M 714 154 L 698 148 L 711 162 L 692 160 L 710 171 L 696 176" fill="#fbf7ee" stroke-width="2.5"/>
      <!-- bare facial skin around the eye, up to the bill base -->
      <path d="M 738 162 C 748 158 758 163 760 172 L 759 192 C 748 194 738 190 735 182 C 733 174 734 166 738 162 Z" fill="#f7c6ae" stroke="none"/>
      <!-- eye -->
      <circle cx="746" cy="176" r="8" fill="#f9eed6" stroke-width="2"/>
      <circle cx="747" cy="177" r="4.5" fill="#1b1d24" stroke="none"/>
      <circle cx="745" cy="174.5" r="1.5" fill="#ffffff" stroke="none"/>
    </g>
    <!-- bill: pouch first (hangs from the lower mandible), then the mandibles -->
    <g id="bill">
      <path id="pouch" d="M 748 204 C 742 262 760 302 790 298 C 836 292 878 254 910 226 L 754 195 Z" fill="#f4a24f"/>
      <path d="M 754 250 C 764 290 790 304 826 290 C 804 302 772 292 754 250 Z" fill="#e2843a" stroke="none"/>
      <!-- fish tail peeking out of the bill tip -->
      <path id="fish" d="M 908 222 L 944 204 L 936 223 L 946 240 Z" fill="#9dbfd1" stroke-width="3"/>
      <path d="M 920 220 L 936 212 M 922 226 L 938 232" fill="none" stroke="#6f98ad" stroke-width="2"/>
      <!-- lower mandible (thin rami) -->
      <path d="M 754 195 L 912 228" stroke-width="5" fill="none"/>
      <!-- upper mandible with the hooked nail -->
      <path id="upper-mandible" d="M 757 170 C 820 182 880 200 914 214
        C 922 218 922 230 914 234
        L 754 195 Z" fill="#f5c242"/>
      <path d="M 762 186 C 820 196 870 208 900 216 C 870 214 818 204 762 190 Z" fill="#dfa12a" stroke="none"/>
      <path d="M 910 216 C 922 218 922 230 914 234 Z" fill="#e2773d" stroke="none"/>
      <!-- forehead feathers come to a point over the bill base -->
      <path d="M 740 160 C 752 158 760 164 768 172 C 758 170 748 168 740 166 Z" fill="#fbf7ee" stroke-width="2.5"/>
    </g>
  </g>
</svg>
