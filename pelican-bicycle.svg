<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A great white pelican rides a teal city bicycle along a seaside road, facing right. Its webbed feet are on the pedals, one wing rests on the swept-back handlebar grip with its black primaries hanging below the bar, and the tail of a small fish pokes out of the tip of its long bill. Flat vector illustration with a sea horizon, a sun, two clouds, a drifting feather and a dashed road line.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cbbea"/>
      <stop offset="1" stop-color="#e4f2fb"/>
    </linearGradient>
    <radialGradient id="sunglow">
      <stop offset="0.45" stop-color="#ffe58a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe58a" stop-opacity="0"/>
    </radialGradient>
    <!-- one wheel, drawn at the origin and placed twice with <use> -->
    <g id="wheel">
      <circle r="101" fill="none" stroke="#2c2f38" stroke-width="14"/>
      <circle r="91" fill="none" stroke="#d3d7dc" stroke-width="7"/>
      <circle r="86.8" fill="none" stroke="#8f949c" stroke-width="1.5"/>
      <g stroke="#b9bec6" stroke-width="1.8" stroke-linecap="round">
        <line x1="11" y1="0" x2="86" y2="0"/>
        <line x1="10.3" y1="-3.8" x2="80.8" y2="-29.4"/>
        <line x1="8.4" y1="-7.1" x2="65.9" y2="-55.3"/>
        <line x1="5.5" y1="-9.5" x2="43" y2="-74.5"/>
        <line x1="1.9" y1="-10.8" x2="14.9" y2="-84.7"/>
        <line x1="-1.9" y1="-10.8" x2="-14.9" y2="-84.7"/>
        <line x1="-5.5" y1="-9.5" x2="-43" y2="-74.5"/>
        <line x1="-8.4" y1="-7.1" x2="-65.9" y2="-55.3"/>
        <line x1="-10.3" y1="-3.8" x2="-80.8" y2="-29.4"/>
        <line x1="-11" y1="0" x2="-86" y2="0"/>
        <line x1="-10.3" y1="3.8" x2="-80.8" y2="29.4"/>
        <line x1="-8.4" y1="7.1" x2="-65.9" y2="55.3"/>
        <line x1="-5.5" y1="9.5" x2="-43" y2="74.5"/>
        <line x1="-1.9" y1="10.8" x2="-14.9" y2="84.7"/>
        <line x1="1.9" y1="10.8" x2="14.9" y2="84.7"/>
        <line x1="5.5" y1="9.5" x2="43" y2="74.5"/>
        <line x1="8.4" y1="7.1" x2="65.9" y2="55.3"/>
        <line x1="10.3" y1="3.8" x2="80.8" y2="29.4"/>
      </g>
      <circle r="11" fill="#a9afb7" stroke="#2b3a55" stroke-width="2.5"/>
      <circle r="3.5" fill="#2b3a55"/>
    </g>
  </defs>

  <!-- ===== background: sky, sun, clouds, sea, sand, road ===== -->
  <g id="background">
    <rect width="1200" height="800" fill="url(#sky)"/>
    <circle cx="178" cy="162" r="96" fill="url(#sunglow)"/>
    <circle cx="178" cy="162" r="46" fill="#ffd45f"/>
    <g id="clouds" fill="#ffffff" opacity="0.92">
      <path d="M 300 120 a 26 26 0 0 1 48 -14 a 30 30 0 0 1 56 10 a 20 20 0 0 1 10 38 H 296 a 18 18 0 0 1 4 -34 Z"/>
      <path d="M 1010 150 a 22 22 0 0 1 40 -12 a 26 26 0 0 1 48 8 a 17 17 0 0 1 8 32 H 1006 a 15 15 0 0 1 4 -28 Z"/>
    </g>
    <rect y="560" width="1200" height="73" fill="#58a8d6"/>
    <rect y="560" width="1200" height="3" fill="#a9d7f0"/>
    <!-- wave glints, kept clear of the wheels -->
    <g stroke="#9fd2ee" stroke-width="3" stroke-linecap="round">
      <line x1="60" y1="590" x2="140" y2="590"/>
      <line x1="112" y1="608" x2="166" y2="608"/>
      <line x1="880" y1="596" x2="960" y2="596"/>
      <line x1="1000" y1="584" x2="1060" y2="584"/>
      <line x1="1040" y1="612" x2="1120" y2="612"/>
    </g>
    <rect y="632" width="1200" height="21" fill="#ebd9b2"/>
    <rect y="652" width="1200" height="148" fill="#878e99"/>
    <rect y="652" width="1200" height="4" fill="#6f7681"/>
    <line x1="0" y1="740" x2="1200" y2="740" stroke="#eef1f4" stroke-width="6" stroke-dasharray="64 44" opacity="0.9"/>
    <!-- contact shadows under the tyres -->
    <ellipse cx="336" cy="694" rx="86" ry="9" fill="#3c4350" opacity="0.28"/>
    <ellipse cx="681.6" cy="694" rx="86" ry="9" fill="#3c4350" opacity="0.28"/>
    <!-- a single drifting feather behind the rider -->
    <g transform="rotate(-18 236 326)" opacity="0.9">
      <path d="M 214 330 c 10 -14 26 -20 44 -16 c -8 12 -26 20 -44 16 Z" fill="#ffffff" stroke="#2b3a55" stroke-width="2" stroke-linejoin="round"/>
      <line x1="214" y1="330" x2="258" y2="314" stroke="#2b3a55" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ===== bicycle (drive side: the bike faces right, so chain and chainring are on the viewer's side) ===== -->
  <g id="bicycle" stroke-linecap="round" stroke-linejoin="round">
    <g id="wheels">
      <use href="#wheel" xlink:href="#wheel" x="330" y="582"/>
      <use href="#wheel" xlink:href="#wheel" x="675.6" y="582" transform="rotate(7 675.6 582)"/>
    </g>
    <!-- far crank arm and pedal (behind the frame) -->
    <g id="crank-far">
      <line x1="470.4" y1="598" x2="416.4" y2="598" stroke="#4a4f5a" stroke-width="7"/>
      <rect x="401.4" y="594" width="30" height="8" rx="2" fill="#2c2f38"/>
    </g>
    <!-- far leg and foot (behind the frame): hip -> backward ankle -> foot on the far pedal -->
    <g id="leg-far" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 450 438 L 404 504 L 406.4 586" fill="none" stroke="#2b3a55" stroke-width="19"/>
      <path d="M 450 438 L 404 504 L 406.4 586" fill="none" stroke="#d8784a" stroke-width="13"/>
      <path d="M 392.4 588 C 394.4 580 408.4 575 424.4 575 L 448.4 582 C 454.4 584 454.4 590 448.4 592 L 392.4 593 Z" fill="#d8784a" stroke="#2b3a55" stroke-width="3"/>
    </g>
    <!-- outline pass: the same tubes 4 units wider in the ink colour, so the frame keeps its edge against sea and road -->
    <g id="frame-outline" fill="none" stroke="#2b3a55" stroke-width="15">
      <line x1="330" y1="582" x2="470.4" y2="598"/>
      <line x1="330" y1="582" x2="429.5" y2="464.1"/>
      <line x1="470.4" y1="598" x2="429.5" y2="464.1"/>
      <line x1="429.5" y1="464.1" x2="620" y2="460"/>
      <line x1="470.4" y1="598" x2="632" y2="496"/>
      <line x1="620" y1="460" x2="632" y2="496" stroke-width="18"/>
      <line x1="632" y1="496" x2="675.6" y2="582" stroke-width="13"/>
      <line x1="632" y1="496" x2="637.2" y2="506.3" stroke-width="20"/>
    </g>
    <g id="frame" fill="none" stroke="#2e8d8b" stroke-width="11">
      <line x1="330" y1="582" x2="470.4" y2="598"/>            <!-- chain stay -->
      <line x1="330" y1="582" x2="429.5" y2="464.1"/>  <!-- seat stay -->
      <line x1="470.4" y1="598" x2="429.5" y2="464.1"/>      <!-- seat tube -->
      <line x1="429.5" y1="464.1" x2="620" y2="460"/> <!-- top tube -->
      <line x1="470.4" y1="598" x2="632" y2="496"/>    <!-- down tube -->
      <line x1="620" y1="460" x2="632" y2="496" stroke-width="14"/> <!-- head tube -->
      <line x1="632" y1="496" x2="675.6" y2="582" stroke-width="9"/> <!-- fork -->
      <line x1="632" y1="496" x2="637.2" y2="506.3" stroke-width="16"/> <!-- fork crown -->
      <line x1="429.5" y1="464.1" x2="417.8" y2="425.9" stroke="#4a4f5a" stroke-width="7"/> <!-- seat post -->
      <line x1="620" y1="460" x2="610" y2="430" stroke="#4a4f5a" stroke-width="8"/>  <!-- steerer / quill -->
      <line x1="610" y1="430" x2="632" y2="425" stroke="#4a4f5a" stroke-width="8"/>  <!-- stem -->
      <!-- swept-back handlebar: rises from the stem clamp and comes back toward the rider -->
      <path d="M 632 425 C 644 407 628 395 608 407" stroke="#4a4f5a" stroke-width="8"/>
      <circle cx="470.4" cy="598" r="9" fill="#206d6b" stroke="none"/> <!-- bottom bracket shell -->
    </g>
    <g id="drivetrain">
      <circle cx="330" cy="582" r="13" fill="none" stroke="#4a4f5a" stroke-width="5"/>
      <circle cx="470.4" cy="598" r="30" fill="none" stroke="#4a4f5a" stroke-width="6"/>
      <circle cx="470.4" cy="598" r="20" fill="none" stroke="#4a4f5a" stroke-width="3" stroke-dasharray="6 7"/>
      <!-- chain: top and bottom runs between ring and cog (solid run, then a dashed link overlay on the same coordinates) -->
      <g stroke="#3d414b" stroke-width="4.5" fill="none">
        <line x1="470.4" y1="568" x2="330" y2="569"/>
        <line x1="470.4" y1="628" x2="330" y2="595"/>
      </g>
      <g stroke="#8d929c" stroke-width="1.5" fill="none" stroke-dasharray="3 4">
        <line x1="470.4" y1="568" x2="330" y2="569"/>
        <line x1="470.4" y1="628" x2="330" y2="595"/>
      </g>
      <!-- near crank arm and pedal -->
      <line x1="470.4" y1="598" x2="524.4" y2="598" stroke="#4a4f5a" stroke-width="8"/>
      <circle cx="470.4" cy="598" r="6" fill="#4a4f5a"/>
      <rect x="508.4" y="593.5" width="32" height="9" rx="2" fill="#2c2f38"/>
    </g>
    <!-- saddle: wide at the back, narrow nose forward (the rump covers its middle) -->
    <path id="saddle" d="M 379.8 425.9 C 369.8 417.9 377.8 408.9 395.8 409.9 C 415.8 410.9 441.8 414.9 457.8 419.9 C 443.8 425.9 415.8 427.9 395.8 427.9 C 385.8 427.9 379.8 427.9 379.8 425.9 Z" fill="#5d3a2a" stroke="#2b3a55" stroke-width="3"/>
  </g>

  <!-- ===== pelican ===== -->
  <g id="pelican" stroke="#2b3a55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- far wing: black primary tips projecting past the rump, and the short tail -->
    <path id="primaries-far" d="M 448 338 C 404 342 362 348 322 352 L 330 358 L 318 365 L 424 376 C 434 366 442 352 448 338 Z" fill="#2a2d36"/>
    <path id="tail" d="M 362 372 C 340 374 318 380 304 388 L 322 396 L 298 402 L 322 408 L 308 416 C 330 416 350 412 368 406 Z" fill="#fbf7ee"/>
    <!-- body, neck and head as one silhouette (no seams) -->
    <path id="body" d="M 362 372
      C 400 330 450 300 500 294
      C 525 290 548 292 556 300
      C 566 262 606 208 706 178
      C 704 150 746 142 760 168
      L 754 195 L 744 207
      C 650 236 632 300 598 334
      C 610 345 614 360 612 372
      C 612 400 600 418 585 420
      C 560 438 530 444 505 442
      C 480 440 455 436 436 426
      C 400 420 380 416 368 406 Z" fill="#fbf7ee"/>
    <!-- belly shade (one tone) -->
    <path d="M 446 420 C 470 436 520 440 575 420 C 545 428 490 428 446 420 Z" fill="#e6ddcc" stroke="none"/>
    <!-- scapular / folded-wing plate hint on the flank, and the feathered thigh -->
    <path d="M 392 356 C 440 338 500 332 548 352" fill="none" stroke-width="2.5" opacity="0.55"/>
    <path d="M 448 414 C 456 427 480 431 494 417" fill="none" stroke-width="2.5" opacity="0.5"/>
    <!-- near leg: shank with the backward ankle, webbed foot flat on the pedal -->
    <g id="leg-near">
      <path d="M 462 448 L 458 503 L 510.4 587" fill="none" stroke="#2b3a55" stroke-width="21"/>
      <path d="M 462 448 L 458 503 L 510.4 587" fill="none" stroke="#f08a57" stroke-width="15"/>
      <path id="foot-near" d="M 498.4 592 C 500.4 584 514.4 579 532.4 579 L 558.4 586 C 565.4 588 565.4 594 558.4 596 L 498.4 597 Z" fill="#f08a57" stroke-width="3"/>
      <!-- toe lines on the web and two small claw nicks at the front edge -->
      <path d="M 512.4 589 L 552.4 585 M 514.4 594 L 554.4 591" fill="none" stroke="#d3683c" stroke-width="1.8"/>
      <path d="M 562.4 587 l -3 1.5 M 564.4 592 l -3 1" fill="none" stroke-width="2"/>
    </g>
    <!-- near wing: coverts white, secondaries dark along the trailing edge; the body-side edge is only hinted -->
    <g id="wing-near">
      <path d="M 536 297 C 576 316 592 362 594 397 C 576 414 552 428 520 420 C 498 412 484 394 488 368 C 494 340 512 314 536 297 Z" fill="#fbf7ee" stroke="none"/>
      <path d="M 536 297 C 576 316 592 362 594 397 C 576 414 552 428 520 420 C 498 412 484 394 488 368" fill="none"/>
      <path d="M 488 368 C 494 340 512 314 536 297" fill="none" stroke-width="2.5" opacity="0.35"/>
      <path d="M 502 342 C 534 350 560 372 574 398 M 494 370 C 520 380 544 398 556 414" fill="none" stroke-width="2.5" opacity="0.5"/>
      <path d="M 592 403 Q 560 430 546 426 Q 532 432 520 422 Q 506 424 498 410 Q 490 406 490 390 C 506 406 540 412 592 403 Z" fill="#2a2d36" stroke="none"/>
      <!-- primaries: six long narrow feathers hanging from the wrist, behind the grip -->
      <path d="M 598 399 Q 594.8 425.2 600 451 Q 603.2 424.8 598 399 Z" fill="#2a2d36" stroke-width="2.5"/>
      <path d="M 595 402 Q 588.4 424.5 590 448 Q 596.7 425.5 595 402 Z" fill="#2a2d36" stroke-width="2.5"/>
      <path d="M 592 405 Q 582 423.8 580 445 Q 590.1 426.2 592 405 Z" fill="#2a2d36" stroke-width="2.5"/>
      <path d="M 589 408 Q 575.9 423 570 442 Q 583.2 427 589 408 Z" fill="#2a2d36" stroke-width="2.5"/>
      <path d="M 586 411 Q 570 422.1 560 439 Q 576.1 427.9 586 411 Z" fill="#2a2d36" stroke-width="2.5"/>
      <path d="M 583 414 Q 564.2 421.5 550 436 Q 568.9 428.5 583 414 Z" fill="#2a2d36" stroke-width="2.5"/>
      <!-- the grip is in front of the hanging primaries, and the wrist rests on top of it -->
      <line x1="608" y1="407" x2="564" y2="414" stroke="#2b3a55" stroke-width="20"/>
      <line x1="608" y1="407" x2="564" y2="414" stroke="#7a4a30" stroke-width="14"/>
      <circle cx="564" cy="414" r="8" fill="#3a3d46" stroke-width="2.5"/>
      <ellipse cx="596" cy="399" rx="12" ry="8" fill="#fbf7ee" stroke-width="3"/>
    </g>
    <!-- bill: pouch first (it hangs from the lower mandible and is attached along the throat), then the mandibles -->
    <g id="bill">
      <path id="pouch" d="M 754 195 L 744 207 C 710.2 217.4 686.2 232.4 667.7 248.9 C 675.7 292.9 726 310 776 300 C 830 290 878 254 910 226 Z" fill="#f4a24f"/>
      <path d="M 677.7 264.9 C 700 296 736 310 790 296 C 748 304 708 294 677.7 264.9 Z" fill="#e2843a" stroke="none"/>
      <!-- fish tail peeking out of the bill tip -->
      <path id="fish" d="M 908 222 L 944 204 L 936 223 L 946 240 Z" fill="#9dbfd1" stroke-width="3"/>
      <path d="M 920 220 L 936 212 M 922 226 L 938 232" fill="none" stroke="#6f98ad" stroke-width="2"/>
      <!-- lower mandible (thin rami) -->
      <path d="M 754 195 L 912 228" stroke-width="5" fill="none"/>
      <!-- upper mandible with the hooked nail -->
      <path id="upper-mandible" d="M 757 170 C 820 182 880 200 914 214
        C 922 218 922 230 914 234
        L 754 195 Z" fill="#f5c242"/>
      <path d="M 762 186 C 820 196 870 208 900 216 C 870 214 818 204 762 190 Z" fill="#dfa12a" stroke="none"/>
      <path d="M 910 216 C 922 218 922 230 914 234 Z" fill="#e2773d" stroke="none"/>
    </g>
    <!-- head details -->
    <g id="head">
      <!-- nape tuft -->
      <path d="M 714 154 L 698 148 L 711 162 L 692 160 L 710 171 L 696 176" fill="#fbf7ee" stroke-width="2.5"/>
      <!-- bare facial skin around the eye, forward to the bill base -->
      <path d="M 738 162 C 748 158 758 163 760 172 L 759 192 C 748 194 738 190 735 182 C 733 174 734 166 738 162 Z" fill="#f7c6ae" stroke="none"/>
      <!-- eye -->
      <circle cx="746" cy="176" r="8" fill="#f9eed6" stroke-width="2"/>
      <circle cx="747" cy="177" r="4.5" fill="#1b1d24" stroke="none"/>
      <circle cx="745" cy="174.5" r="1.5" fill="#ffffff" stroke="none"/>
    </g>
  </g>
</svg>
